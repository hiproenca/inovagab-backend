services:
  mongodb:
    image: mongodb/mongodb-community-server:latest
    container_name: inovagab-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - inovagab-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    image: ${IMAGE_NAME:-inovagab-backend}:${IMAGE_TAG:-latest}
    container_name: inovagab-api
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      # Sobrescreve spring.mongodb.uri do application.properties (relaxed binding)
      SPRING_MONGODB_URI: mongodb://mongodb:27017/${MONGO_DB:-inovagab_db}
      JWT_SECURITY_KEY: ${JWT_SECURITY_KEY:?Defina JWT_SECURITY_KEY no arquivo .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - inovagab-net
    restart: unless-stopped

networks:
  inovagab-net:
    driver: bridge

volumes:
  mongo_data: