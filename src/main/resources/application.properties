spring.application.name=inovagab


spring.mongodb.uri=mongodb://localhost:27017/inovagab_db
server.port=8080

api.security.token.secret=${JWT_SECURITY_KEY}
api.security.token.expiration=86400000

#gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models
gemini.api.base-url=https://generativelanguage.googleapis.com/v1beta/models
gemini.api.models=gemini-3.8-flash,gemini-3.7-flash,gemini-3.5-flash-lite

gemini.api.key=${GEMINI_API_KEY}